version: "3.8"

networks:
  edge_net:
    external: true

  infra_net:
    external: true

  app_net:
    driver: bridge

  data_net:
    driver: bridge

services:
  # ----------------------------------------------------
  # Reverse Proxy (NPM)
  # ----------------------------------------------------
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: reverse-proxy
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:81/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    ports:
      - "80:80"
      - "443:443"
      - "81:81"

    environment:
      DB_MYSQL_HOST: "npm_db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "${NPM_DB_PASSWORD}"
      DB_MYSQL_NAME: "npm"

    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

    networks:
      - edge_net
      - app_net
      - infra_net

    depends_on:
      npm_db:
        condition: service_healthy

  # ----------------------------------------------------
  # NPM Database
  # ----------------------------------------------------
  npm_db:
    image: mariadb:10.11
    container_name: npm_db
    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    environment:
      MYSQL_ROOT_PASSWORD: "${NPM_DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "npm"
      MYSQL_USER: "npm"
      MYSQL_PASSWORD: "${NPM_DB_PASSWORD}"

    volumes:
      - npm_db_data:/var/lib/mysql
    networks:
      - infra_net

  # ----------------------------------------------------
  # SaaS DB
  # ----------------------------------------------------
  saas_db:
    image: mysql:8.0
    container_name: saas_db
    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"

    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data_net

  # ----------------------------------------------------
  # phpMyAdmin (FIXED for Tailscale access)
  # ----------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always

    ports:
      - "8080:80"

    environment:
      PMA_HOST: saas_db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M

    networks:
      - data_net

    depends_on:
      saas_db:
        condition: service_healthy

  # ----------------------------------------------------
  # App Layer
  # ----------------------------------------------------
  landing:
    image: nginx:alpine
    container_name: landing
    restart: always
    volumes:
      - ./landing:/usr/share/nginx/html
    networks:
      - app_net

  app:
    image: nginx:alpine
    container_name: app
    restart: always
    volumes:
      - ./app:/usr/share/nginx/html
    networks:
      - app_net

  api:
    image: nginx:alpine
    container_name: api
    restart: always
    volumes:
      - ./api:/usr/share/nginx/html
    networks:
      - app_net
      - data_net

volumes:
  npm_data:
  npm_letsencrypt:
  npm_db_data:
  mysql_data:
